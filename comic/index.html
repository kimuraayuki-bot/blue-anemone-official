<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMIC | 王女のブルーアネモネ号</title>
<link rel="preload" as="image" href="/assets/header-logo.webp" fetchpriority="high">
<link rel="preload" as="image" href="/comic/01-06/%E7%8E%8B%E5%A5%B3%E3%81%AE%E3%83%95%E3%82%99%E3%83%AB%E3%83%BC%E3%82%A2%E3%83%8D%E3%83%A2%E3%83%8D%E3%80%80%E3%83%92%E3%82%9A%E3%83%83%E3%83%81_001.png" fetchpriority="high">
<link rel="stylesheet" href="/comic/comic.css">
</head>
<body>
<header class="comic-header">
  <a class="brand" href="/"><img src="/assets/header-logo.webp" alt="王女のブルーアネモネ号" width="2615" height="1290" fetchpriority="high" decoding="async"></a>
  <nav><a href="/">OFFICIAL SITE</a><a href="#comic">COMIC</a></nav>
</header>
<main id="comic">
  <section class="comic-title">
    <p>THE H.R.H.S BLUE ANEMONE</p>
    <h1>COMIC</h1>
    <span>6 PAGES</span>
  </section>
  <section class="comic-pages" aria-label="王女のブルーアネモネ号 漫画"></section>
</main>
<footer class="comic-footer">
  <a href="/">OFFICIAL SITE</a>
  <a href="#comic">PAGE TOP ↑</a>
</footer>
<script>
const pages = [
  "王女のブルーアネモネ　ピッチ_001.png",
  "王女のブルーアネモネ　ピッチ_002.png",
  "王女のブルーアネモネ　ピッチ_003.png",
  "王女のブルーアネモネ　ピッチ_004.png",
  "王女のブルーアネモネ　ピッチ_005.png",
  "王女のブルーアネモネ　ピッチ_006.png"
];
const root = document.querySelector(".comic-pages");
pages.forEach((filename, index) => {
  const page = index + 1;
  const figure = document.createElement("figure");
  const image = document.createElement("img");
  image.src = `/comic/01-06/${encodeURIComponent(filename)}`;
  image.alt = `王女のブルーアネモネ号 漫画 ${page}ページ`;
  image.width = 5197;
  image.height = 7323;
  image.decoding = "async";
  if (page === 1) {
    image.loading = "eager";
    image.fetchPriority = "high";
  } else {
    image.loading = "lazy";
  }
  figure.appendChild(image);
  root.appendChild(figure);
});
</script>
</body>
</html>
